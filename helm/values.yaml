nameOverride: ""
fullnameOverride: ""
replicaCount: 1
revisionHistoryLimit: 3

image:
  repository: digital-bank-java/payment-service
  tag: "0.0.2"
  pullPolicy: IfNotPresent

runtime:
  profile: default
  configServerUrl: http://config-server:8888

database:
  host: postgres
  port: 5432
  name: payment_service
  secretName: postgres
  usernameKey: POSTGRES_USER
  passwordKey: POSTGRES_PASSWORD

auth:
  enabled: false
  secretName: auth-service-secrets
  secretKey: jwt-secret

service:
  type: ClusterIP
  port: 8085

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

temporaryStorage:
  sizeLimit: 64Mi

terminationGracePeriodSeconds: 30
